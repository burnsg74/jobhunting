# jobhunting.localhost -> static SPA build + /api proxy to the node:http API (pm2 `jobhunting-api`, port 4002).
# Symlinked into /opt/homebrew/etc/nginx/servers/ by deploy/setup.sh.
server {
    listen 80;
    listen [::]:80;
    server_name jobhunting.localhost;

    root /Users/greg/Code/Local/4002-jobhunting/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 6m;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: deep links like /jobs/123 return index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
